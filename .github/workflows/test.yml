name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.11.13 is not published for the current runner image
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyyaml
      - name: Run assistant tests
        run: python -m pytest -q
      - name: Run UI automation tests
        env:
          PYTHONPATH: bot
        run: python -m pytest -q bot/tests
